services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: subastas-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "Subastas12345!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
